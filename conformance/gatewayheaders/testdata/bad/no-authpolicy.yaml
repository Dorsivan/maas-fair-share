# A route added straight to a Gateway with no AuthPolicy at all -- the exact
# "someone adds a route later" scenario UNI-33 is about.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bare-gateway
  namespace: bad-ns
spec:
  gatewayClassName: data-science-gateway-class
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bare-route
  namespace: bad-ns
spec:
  parentRefs:
    - kind: Gateway
      name: bare-gateway
  rules:
    - backendRefs:
        - group: inference.networking.x-k8s.io
          kind: InferencePool
          name: bare-pool
          port: 8000
