# A Gateway-scoped AuthPolicy covers every HTTPRoute parented to it, which is
# the shape actually used by maas-poc-gateway-authn on the real cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: good-gateway
  namespace: good-ns
spec:
  gatewayClassName: data-science-gateway-class
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: good-route
  namespace: good-ns
spec:
  parentRefs:
    - kind: Gateway
      name: good-gateway
  rules:
    - backendRefs:
        - group: inference.networking.x-k8s.io
          kind: InferencePool
          name: good-pool
          port: 8000
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: good-gateway-authn
  namespace: good-ns
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: good-gateway
  rules:
    response:
      success:
        headers:
          x-llm-d-inference-objective:
            plain:
              expression: auth.identity.objective
