# A route straight to a Service never passes through the EPP's ext_proc
# filter, so it is out of scope for this check and must not be flagged even
# though there is no AuthPolicy anywhere in this file.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: plain-gateway
  namespace: good-ns
spec:
  gatewayClassName: data-science-gateway-class
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plain-route
  namespace: good-ns
spec:
  parentRefs:
    - kind: Gateway
      name: plain-gateway
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: some-service
          port: 8080
