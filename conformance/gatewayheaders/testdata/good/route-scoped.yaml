# A route-scoped AuthPolicy, and cross-namespace parentRef (the route lives in
# a model namespace, the Gateway in openshift-ingress) resolved explicitly.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: openshift-ingress
spec:
  gatewayClassName: data-science-gateway-class
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-route
  namespace: model-ns
spec:
  parentRefs:
    - kind: Gateway
      name: shared-gateway
      namespace: openshift-ingress
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: model-pool
          port: 8000
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: model-route-authn
  namespace: model-ns
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: model-route
  rules:
    response:
      success:
        headers:
          X-LLM-D-Inference-Objective:
            plain:
              expression: auth.identity.objective
