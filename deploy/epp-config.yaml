apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-epp-config
  namespace: llm            # set to the serving namespace
data:
  epp: |
    # v1alpha1, NOT v1 -- "llm-d.ai/v1" fails at startup with
    # `no kind "EndpointPickerConfig" is registered for version "llm-d.ai/v1"`.
    #
    # Two groups are accepted. Most examples in the wild still say
    # `inference.networking.x-k8s.io/v1alpha1` (the Gateway API Inference
    # Extension group this config was inherited from) and it still loads, but
    # configloader.go registers it as deprecatedSchemeGroupVersion and logs
    # "DEPRECATION: ... is deprecated" on every startup. Verified both against
    # the v0.11.0 binary. Use the llm-d.ai group.
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    featureGates: [flowControl]
    plugins:
      - type: maas-weighted-fairness
        name: maas-fairness
        parameters:
      # x-maas-subscription, NOT x-maas-subscription-id.
          #
          # This was wrong for most of the POC and the failure is silent: with
          # the id suffix the header simply never matches, every request falls
          # to defaultGroup, and unmatched_subscriptions_total stays at ZERO --
          # because nothing was mis-matched, the header was absent. The only
          # symptom is all traffic quietly sharing the `unclassified` weight.
          #
          # Verified against the AuthPolicy MaaS generates per model
          # (maas-auth-<model> in the model namespace), whose success response
          # injects exactly:
          #     X-MaaS-Subscription: auth.metadata.apiKeyValidation.subscription
          # i.e. the MaaSSubscription NAME from the validated sk-oai API key.
          # It also blanks Authorization before forwarding upstream.
          #
          # CONSEQUENCE FOR `groups` BELOW: the match values must be
          # MaaSSubscription names, not invented tenant strings. Confirm with
          #     oc get maassubscriptions -A
          # before trusting any weight in this file.
          identityHeader: x-maas-subscription

          # Weights sum to 100 so each number reads as a guaranteed floor.
          # First match wins: explicit applications before the prefix catch-all.
          # DO NOT FINALISE these until the shadow-mode traffic-shape table is read --
          # they are coupled to the cost weights below.
          groups:
            - { name: app1,      weight: 20, match: { exact:  [app1-production] } }
            - { name: app2,      weight: 10, match: { exact:  [app2-batch] } }
            - { name: end-users, weight: 65, match: { prefix: [end-user-] } }
          defaultGroup: { name: unclassified, weight: 5 }

          # false = account and emit every metric, but let FCFS decide. Deploy this way
          # first. Flip only after the shadow period.
          enforce: false
          stateLogIntervalSeconds: 30    # flight-recorder log cadence; 0 disables

          # The averaging window. NOT the tightness dial.
          # A half-life is not a window: 60s still remembers 25% of two minutes ago.
          # Matching a hard W-second sliding window gives H ~= W/3 (so "1 minute" is
          # ~20s), BUT that loses to the duration floor: requests take 10-30s here,
          # and at H=20 a 30s request's provisional charge decays to 35% before it
          # completes. 60 is near the FLOOR of the sane range, not the middle.
          # If shadow data looks noisy, move UP to 120. Never down.
          halfLifeSeconds: 60

          # Additional half-lives to ACCOUNT AND REPORT but not act on. These observe
          # the ACTUAL request stream through a different smoothing window -- they are
          # NOT a counterfactual simulation of what that window would have decided.
          # Read during shadow mode, when the stream is unshaped by any half-life.
          # 120 is the live alternative if 60 proves noisy; 20 is kept as a CONTROL.
          observedHalfLivesSeconds: [20, 120]

          # Which resource the tab is denominated in. "tokens" matches the Kuadrant
          # ceiling and every vLLM dashboard. "vramtime" (= O*(P+O/2), KV residency)
          # is specified but NOT enabled -- see docs/design.md Part 3 item 9.
          costModel: tokens

          inputTokenWeight: 1.0
          # CALIBRATE THIS, don't inherit it. 2.0 is a convention with no physical
          # basis: prefill and decode cost ~the same FLOPs/token, and the real ratio
          # is an EFFICIENCY ratio (prefill chunk size / decode batch size), plausibly
          # 5-20x at typical batch sizes. Commercial APIs price output at 3-5x.
          # Run the two-profile guidellm experiment in docs/design.md BEFORE shadow
          # mode -- it changes the unit every later number is read in.
          outputTokenWeight: 2.0   # PLACEHOLDER until calibrated

          # Discount DISABLED to start. It sets the UNIT the floor is denominated in,
          # only matters where groups' hit rates DIFFER, and is coupled to the group
          # weights above. 1.0 matches Kuadrant, which does not discount cached
          # tokens. Wrong-low breaks other tenants' floors; wrong-high only
          # under-serves the cacheable tenant -- fail in the second direction.
          # NEVER 0: that is an exemption, not a discount.
          cachedInputTokenWeight: 1.0

          # Stops a returning-idle tenant claiming retroactive credit. Exposed as a
          # flag ONLY so load-test P4 can run both ways -- read the OTHER tenants'
          # throughput during the transition, not the newcomer's. Turning it off
          # re-couples fairness to idleness and breaks work conservation.
          newcomerClamp: true
          # UNI-212: the empty->non-empty edge this clamp fires on is otherwise
          # keyed to the shared Pick-call sequence, which advances on a ~1ms
          # ticker and on every OTHER group's enqueue too -- so a group drained
          # its own queue by being served efficiently (milliseconds) looked
          # identical to a genuine return from idle (tens of seconds). This
          # requires real wall-clock absence before the edge counts. 2s is well
          # above normal dispatch churn and well below halfLifeSeconds (60s).
          newcomerClampIdleSeconds: 2

          provisionalCharge: true
          # Fallback only. The real output estimate is min(max_tokens, per-group EWMA
          # of observed output tokens); this applies when neither is available.
          defaultEstimatedOutputTokens: 512
          # ~4 chars/token holds for Latin-script prose. CJK is ~1-2 and multimodal is
          # unrelated to byte size -- both appear as a PERSISTENT BIAS (not noise) in
          # truing_error_tokens. The tokenizer is deliberately never invoked.
          estimatedBytesPerToken: 4

          agingTokensPerSecond: 0

          # x-request-id, x-maas-fairness-group, x-maas-fairness-queue-ms on the
          # response -- see docs/design.md "Per-request attribution" (UNI-53).
          # Defaults to true; set false to suppress if this is considered
          # internal detail leakage.
          emitAttributionHeaders: true

          # V(4) per-request tier (group resolved, estimate charged, true-up
          # delta) -- see docs/design.md "V(4) is off Pick's hot path" (UNI-47).
          # Both default to 0 (off). Neither can be changed without a redeploy
          # (this file is read once at EPP startup), and emission ALSO requires
          # `-v=4` or higher on the EPP process -- also redeploy-only. Left
          # commented out: uncomment only for a time-boxed debugging session,
          # never as a standing production setting.
          #
          # Uncommenting ONLY these two keys leaves the tier silently off --
          # the EPP's own args also need `-v=4` added, and the two gates
          # interact badly with --zap-log-level if that is ever added later.
          # See docs/runbook.md "Turn on the V(4) per-request tier" for the
          # exact edits, both gates, and how to turn it back off.
          # requestTierV4SampleEvery: 100       # emit 1 line per 100 settlements
          # requestTierV4TimeBoxSeconds: 900    # self-disables after 15 minutes

          # There is deliberately no eviction TTL here. program-aware-fairness needs
          # a sweeper because it keys state by raw tenant ID, so its map grows with
          # whatever arrives. We key by GROUP, and the group set is closed by this
          # file -- every unmatched subscription folds into defaultGroup. The state
          # map is therefore bounded at len(groups)+1 by construction and there is
          # nothing to evict. Adding the knob back would only let an operator delete
          # a live group's tab.

      # scheduling profile unchanged from the KServe default
      - type: single-profile-handler
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
      - type: max-score-picker

      # REQUIRED when the cluster has enableLLMInferenceServiceTLS: true in
      # redhat-ods-applications/inferenceservice-config (it does by default on
      # RHOAI 3.4.0). The model servers then serve metrics over TLS, and the EPP
      # scrapes them to feed queue-scorer and kv-cache-utilization-scorer. Get
      # this wrong and the scrape fails silently: the scorers see no data and
      # endpoint selection degrades, while FAIRNESS still works -- so it will
      # not show up in any of the fairness dashboards.
      #
      # Red Hat's downstream EPP takes this as --model-server-metrics-scheme,
      # which upstream does not define; see registerDownstreamCompatFlags in
      # cmd/epp/main.go. On upstream v0.10.0+ this plugin parameter is the only
      # mechanism that works. Declaring the plugin explicitly does NOT break
      # the default data-layer wiring -- core-metrics-extractor is still
      # attached automatically (verified against the v0.11.0 binary).
      #
      # Delete this block if the cluster serves model-server metrics over
      # plaintext; the default scheme is http.
      - type: metrics-data-source
        parameters:
          scheme: https
          insecureSkipVerify: true

    # Fairness is INTRA-BAND only, so every weighted tenant must share one priority.
    # Both defaultPriorityBand and the explicit band are set so stray traffic on
    # another priority is still weighted within its band.
    # Deliberately no usageLimitPolicyPluginRef: ComputeLimit gates whole bands, and
    # with every tenant in one band it can only gate all or none.
    flowControl:
      # Keep within ~2x of halfLifeSeconds. If requests are shed before the policy can
      # rebalance toward them, the shed rate becomes the real allocator.
      defaultRequestTTL: 60s
      defaultPriorityBand:
        fairnessPolicyRef: maas-fairness
        orderingPolicyRef: fcfs-ordering-policy
      priorityBands:
        - priority: 0
          fairnessPolicyRef: maas-fairness
          maxRequests: "5000"

    # queue-scorer and prefix-cache-scorer carry EQUAL weight -- the one
    # deviation from the KServe default (2.0 / 3.0). With prefix at 3.0 and
    # queue at 2.0, a replica holding a ~99% prefix match keeps a constant lead
    # however long its queue grows (queue-scorer is min-max normalized, so its
    # swing is capped at its weight), and the other replica can sit idle for
    # as long as the traffic keeps sharing that prefix. Equal weights let the
    # shorter queue win once the warm replica's queue is longer; prefix
    # affinity still decides between equal queues. Seen in the field and
    # reproduced live -- see docs/poc-results.md "UNI-214".
    schedulingProfiles:
      - name: default
        plugins:
          - { pluginRef: queue-scorer, weight: 3.0 }
          - { pluginRef: kv-cache-utilization-scorer, weight: 2.0 }
          - { pluginRef: prefix-cache-scorer, weight: 3.0 }
          - { pluginRef: max-score-picker }
