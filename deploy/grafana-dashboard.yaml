# Grafana dashboard for the GPU EPP (maas-vllm-gpu-kserve-router-scheduler),
# scoped to job="maas-vllm-gpu-epp-service" per the board's 2026-10-19 GPU-only
# direction (same scoping as deploy/prometheusrule.yaml). The CPU-served EPP
# (job="maas-vllm-cpu-epp-service") is out of scope and never selected below.
#
# TARGET CONFIRMED, NOT ASSUMED: this cluster runs a single standalone Grafana
# 11.6.0 (namespace `grafana`, Deployment `grafana`, image
# docker.io/grafana/grafana:11.6.0 -- image floats by tag upstream, out of
# this repo's control to pin) with exactly one Prometheus-type datasource,
# named "Prometheus", provisioned from that namespace's own
# `grafana-datasources` ConfigMap:
#     url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
# i.e. the same UWM Thanos Querier every other observability asset in this
# repo (deploy/prometheusrule.yaml, UNI-30/UNI-49) already reads from. Panels
# below use a `datasource` template variable (type: datasource, query:
# prometheus) rather than a hardcoded UID, so the dashboard resolves against
# whatever single Prometheus-type datasource is present/default -- portable
# across a cluster where that datasource's auto-generated UID differs.
#
# METRIC NAME CHOICE: this namespace's EPP Service is scraped by two of
# KServe's auto-created ServiceMonitors (`kserve-llm-isvc-scheduler` and
# `-default`; see UNI-30), which land the same twelve series under two
# different name prefixes -- `llm_d_epp_maas_fairness_*` and
# `kserve_llm_d_epp_maas_fairness_*`, both carrying identical values (UNI-49
# confirmed live, 2026-10-25). Every query below uses the unprefixed
# `llm_d_epp_maas_fairness_*` family, matching the convention
# deploy/prometheusrule.yaml already established, so the repo's observability
# assets do not disagree with each other over which of two duplicate series
# is "the" metric.
#
# KNOWN GAP -- this ConfigMap does not auto-load into the live Grafana.
# `oc get deployment grafana -n grafana -o yaml` shows the dashboards volume
# is a single ConfigMap named exactly `kueue-dashboard` in the `grafana`
# namespace (`optional: true`; that ConfigMap does not currently exist, so
# the live instance loads zero file-provisioned dashboards right now) -- not
# a label-selector sidecar that would pick up a ConfigMap from any
# namespace. The Engineer role has edit access to `maas-fairness-poc` only
# (openshift-conventions skill), not to the `grafana` namespace, so applying
# this manifest here is the portable, air-gap-transferable artifact the
# ticket asks for, but a human with write access to the `grafana` namespace
# still has to either (a) copy this JSON into a ConfigMap literally named
# `kueue-dashboard` there, or (b) patch the `grafana` Deployment to mount an
# additional volume from this ConfigMap -- cross-namespace ConfigMap volume
# mounts are not supported by Kubernetes, so some copy/sync step is
# unavoidable either way. The exact extraction/apply/restart commands for
# that copy step are in docs/runbook.md, "Load the fairness dashboard into
# the live Grafana" -- do not reconstruct them by hand from this file; the
# data key name below has to match exactly.
#
# GENERATED -- DO NOT HAND-EDIT THE JSON BELOW (UNI-130). The panels are built
# by deploy/grafana-dashboard.py; change that file and run
#     python3 -I deploy/grafana-dashboard.py --write
# which rewrites only the data block under the key line, leaving this header
# alone. UNI-130 grew the dashboard from 6 panels to 51 in 12 rows (run
# overview, PrometheusRule alert states, expected-vs-observed share incl.
# windowed share over time, normalized_service convergence, contended vs total
# tokens, truing error / accounting-leak detectors, classification, flow-control
# queue / wait / shedding per group, traffic and errors, per-group latency,
# vLLM, EPP health), adds the `group` (multi-select fairness_id) and `window`
# (share window) template variables, and Prometheus-backed annotations for
# loadgen Job activity, EPP process start, weight/enforcement changes, vLLM
# replica changes and MaasFairness* alerts firing. Every panel query was run
# through the live Grafana's own /api/ds/query (anonymous Viewer, no import) on
# 2026-11-01 and returned data or a deliberate empty result -- see the UNI-130
# ticket comment. Panels whose metric has no fairness_id label (pool-level
# flow-control outcomes, Istio status codes, vLLM series) say so in their
# description; the provisional in-flight charge is not exported as a metric
# at all, so no panel can show it.
#
# SIZE: `oc apply` stores the whole object in the last-applied-configuration
# annotation (256 KiB cap). This ConfigMap's annotation is ~170 KB; if the
# generator grows the JSON much further, switch the generator to compact JSON
# or load with `oc create`/`oc replace` instead of `apply`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-fairness-dashboard
  namespace: maas-fairness-poc
  labels:
    app.kubernetes.io/name: maas-fairness-dashboard
    # Conventional grafana-sidecar discovery label. Harmless here (this
    # Grafana runs no such sidecar -- see "KNOWN GAP" above) and is what a
    # cluster running the usual kube-prometheus-stack/grafana-operator
    # sidecar would need to pick this ConfigMap up automatically, so it
    # costs nothing to carry for a less constrained destination.
    grafana_dashboard: "1"
data:
  maas-fairness-gpu-epp.json: |
    {
      "title": "MaaS Fairness - GPU EPP (maas-vllm-gpu-kserve-router-scheduler)",
      "uid": "maas-fairness-gpu-epp",
      "description": "Edge-case series dashboard (UNI-130). Set the time range to one run: see docs/runbook.md, 'Find a run on the fairness dashboard'.",
      "tags": [
        "maas-fairness",
        "gpu",
        "epp"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "group",
            "type": "query",
            "label": "Group",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}, fairness_id)",
            "query": {
              "query": "label_values(llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}, fairness_id)",
              "refId": "group"
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "hide": 0
          },
          {
            "name": "window",
            "type": "interval",
            "label": "Share window",
            "query": "1m,2m,5m,10m,15m",
            "current": {
              "selected": true,
              "text": "2m",
              "value": "2m"
            },
            "auto": false,
            "hide": 0,
            "options": [
              {
                "selected": false,
                "text": "1m",
                "value": "1m"
              },
              {
                "selected": true,
                "text": "2m",
                "value": "2m"
              },
              {
                "selected": false,
                "text": "5m",
                "value": "5m"
              },
              {
                "selected": false,
                "text": "10m",
                "value": "10m"
              },
              {
                "selected": false,
                "text": "15m",
                "value": "15m"
              }
            ]
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Loadgen job running",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "iconColor": "blue",
            "step": "15s",
            "expr": "max by (job_name) (kube_job_status_active{namespace=\"maas-fairness-poc\", job_name=~\"maas-loadgen.*\"}) > 0",
            "titleFormat": "loadgen running",
            "textFormat": "Job {{job_name}}",
            "tagKeys": "job_name"
          },
          {
            "name": "EPP process start",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "iconColor": "red",
            "step": "60s",
            "expr": "max by (pod) (process_start_time_seconds{job=\"maas-vllm-gpu-epp-service\"}) * 1000",
            "useValueForTime": true,
            "titleFormat": "EPP started",
            "textFormat": "{{pod}} -- fairness counters reset here",
            "tagKeys": "pod"
          },
          {
            "name": "Weights / enforcement changed",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "iconColor": "purple",
            "step": "30s",
            "expr": "(changes(llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}[1m]) > 0) or (changes(llm_d_epp_maas_fairness_enforcing{job=\"maas-vllm-gpu-epp-service\"}[1m]) > 0)",
            "titleFormat": "config changed",
            "textFormat": "{{__name__}} {{fairness_id}}",
            "tagKeys": "fairness_id"
          },
          {
            "name": "vLLM replica change",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "iconColor": "orange",
            "step": "30s",
            "expr": "changes(kube_deployment_status_replicas_ready{namespace=\"maas-fairness-poc\", deployment=\"maas-vllm-gpu-kserve\"}[1m]) > 0",
            "titleFormat": "vLLM ready replicas changed"
          },
          {
            "name": "MaaS fairness alerts firing",
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "enable": true,
            "iconColor": "dark-red",
            "step": "30s",
            "expr": "ALERTS{alertname=~\"MaasFairness.*\", alertstate=\"firing\"}",
            "titleFormat": "{{alertname}} firing",
            "tagKeys": "alertname,severity"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Run overview -- read this row first",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Enforcement mode",
          "description": "llm_d_epp_maas_fairness_enforcing: 1 = the weighted-fairness pick is honoured; 0 = shadow mode (FCFS decides, the plugin only accounts). In shadow mode observed share is NOT expected to track expected share -- judge nothing below until this says ENFORCING. Serves: every case.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "llm_d_epp_maas_fairness_enforcing{job=\"maas-vllm-gpu-epp-service\"}",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "SHADOW",
                      "color": "blue",
                      "index": 0
                    },
                    "1": {
                      "text": "ENFORCING",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "EPP NOT SCRAPED"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 3,
          "type": "bargauge",
          "title": "Live configured weights",
          "description": "llm_d_epp_maas_fairness_configured_weight -- the weights the running EPP actually loaded (echoed by the plugin, not copied from the repo). Expected at rest: app1=20, app2=10, end-users=65, unclassified=5. A case that patches weights must show the new values here during the run and the originals afterwards. Serves: weight-change cases, rule 3 restore check.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum by (fairness_id) (llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"})",
              "legendFormat": "{{fairness_id}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/^app1( |$)/"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/^app2( |$)/"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/^end-users( |$)/"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/^unclassified( |$)/"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#8f8f8f"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "EPP build",
          "description": "llm_d_epp_info build_ref label of the GPU EPP. Record it with every run: a result is only comparable to another run on the same build.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 10,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "llm_d_epp_info{job=\"maas-vllm-gpu-epp-service\"}",
              "legendFormat": "{{build_ref}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "EPP NOT SCRAPED"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "vLLM replicas (ready / desired)",
          "description": "kube_deployment_status_replicas_ready / kube_deployment_status_replicas for maas-vllm-gpu-kserve. The system under test is 2 replicas; anything else here invalidates a share result unless the case changed it on purpose.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 14,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "kube_deployment_status_replicas_ready{namespace=\"maas-fairness-poc\", deployment=\"maas-vllm-gpu-kserve\"}",
              "legendFormat": "ready",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "kube_deployment_status_replicas{namespace=\"maas-fairness-poc\", deployment=\"maas-vllm-gpu-kserve\"}",
              "legendFormat": "desired",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "EPP restarts in range",
          "description": "increase(kube_pod_container_status_restarts_total) for the GPU EPP container over the selected time range. Any non-zero value means the fairness counters reset mid-run and the share numbers for this range are not trustworthy (the report flags the same thing as epp_restarted).",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"maas-fairness-poc\", pod=~\"maas-vllm-gpu-kserve-router-scheduler-.*\", container=\"main\"}[$__range])) or vector(0)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Loadgen now",
          "description": "sum(kube_job_status_active) over maas-loadgen* Jobs in maas-fairness-poc. Rule 1: only one benchmark on the GPU pool at a time -- check this says IDLE before starting a run.",
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(kube_job_status_active{namespace=\"maas-fairness-poc\", job_name=~\"maas-loadgen.*\"}) or vector(0)",
              "legendFormat": "__auto",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "IDLE",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "PrometheusRule alert states (deploy/prometheusrule.yaml)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Rule loaded?",
          "description": "Whether deploy/prometheusrule.yaml (maas-fairness-alerts) is being evaluated: counts its rule group in the user-workload Thanos Ruler's prometheus_rule_group_rules. NOT LOADED means the alert tiles to the right are blank because nothing evaluates them -- not because the system is healthy. (A rule labelled openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus would be evaluated by UWM Prometheus instead and would read NOT LOADED here; the repo's rule carries no such label.)",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "count(prometheus_rule_group_rules{rule_group=~\".*maas-fairness-poc-maas-fairness-alerts.*\"}) or vector(0)",
              "legendFormat": "__auto",
