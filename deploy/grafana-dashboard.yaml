              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"maas-fairness-poc\", pod=~\"maas-vllm-gpu-kserve-router-scheduler-.*\", container=\"main\"}[$__rate_interval]))",
