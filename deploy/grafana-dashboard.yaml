        {
          "id": 15,
          "type": "row",
          "title": "Delivered share: expected vs observed (the pass criterion)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 11
          }
        },
        {
          "id": 16,
          "type": "table",
          "title": "Expected vs observed share per group (selected time range)",
          "description": "Same arithmetic as deploy/poc/15-fairness-report.py. Expected % = weight / sum of weights of the groups that OFFERED load in the range (had any llm_d_epp_request_total increase) -- an idle group's weight is redistributed, as work conservation requires. Observed % = the group's share of increase(llm_d_epp_maas_fairness_contended_service_tokens_total) over the range (the design's SLI: service only counted while contended). Deviation = observed - expected, in points; the series pass threshold is |deviation| <= 10. Set the time range to exactly the run (see the runbook's time-range convention) or the numbers mix runs. Single-offered-group cases have no contention by definition and show no observed value. Serves: every share case.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "100 * (sum by (fairness_id) (llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}) and on (fairness_id) (sum by (fairness_id) (increase(llm_d_epp_request_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])) > 0)) / scalar(sum(sum by (fairness_id) (llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}) and on (fairness_id) (sum by (fairness_id) (increase(llm_d_epp_request_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])) > 0)))",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "100 * sum by (fairness_id) (increase(llm_d_epp_maas_fairness_contended_service_tokens_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])) / scalar(sum(increase(llm_d_epp_maas_fairness_contended_service_tokens_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])))",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "(100 * sum by (fairness_id) (increase(llm_d_epp_maas_fairness_contended_service_tokens_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])) / scalar(sum(increase(llm_d_epp_maas_fairness_contended_service_tokens_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])))) - on (fairness_id) (100 * (sum by (fairness_id) (llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}) and on (fairness_id) (sum by (fairness_id) (increase(llm_d_epp_request_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])) > 0)) / scalar(sum(sum by (fairness_id) (llm_d_epp_maas_fairness_configured_weight{job=\"maas-vllm-gpu-epp-service\"}) and on (fairness_id) (sum by (fairness_id) (increase(llm_d_epp_request_total{job=\"maas-vllm-gpu-epp-service\"}[$__range])) > 0))))",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum by (fairness_id) (increase(llm_d_epp_request_total{job=\"maas-vllm-gpu-epp-service\"}[$__range]))",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "fairness_id": "Group",
