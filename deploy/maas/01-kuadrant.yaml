# Kuadrant (Red Hat Connectivity Link) control plane.
#
# This is the LOWER of the two layers in the design: Kuadrant enforces the
# per-subscription CEILING (a MaaSSubscription becomes a
# TokenRateLimitPolicy -- "you may not exceed X, ever"), while the EPP fairness
# plugin divides whatever capacity is actually available when tenants contend.
# They are complements, not alternatives: the ceiling bounds what anyone may
# consume, the queue decides who goes next when there is a line.
#
# PREREQUISITE ALREADY MET on this cluster: the operator itself is installed as
# `rhcl-operator` (Red Hat Connectivity Link, v1.3.4) in the `connectivity-link`
# namespace, along with the authorino, limitador, dns and kuadrant controllers.
# Note the DOWNSTREAM NAME -- grepping CSVs for "kuadrant" finds nothing and
# makes it look uninstalled.
#
# Creating this CR is what makes the operator stand up Authorino and Limitador.
# The RHOAI MaaS guide requires it in the `kuadrant-system` namespace
# specifically, so the namespace name is load-bearing, not a convention.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kuadrant-system
---
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec: {}
