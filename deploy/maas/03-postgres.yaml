# Throwaway PostgreSQL for MaaS API-key lifecycle management.
#
# NOT PRODUCTION. MaaS requires PostgreSQL 14+ and OpenShift AI deliberately
# does not ship one -- the guide expects you to bring a managed instance. This
# is a single replica with no backups, no HA and no TLS, existing only so the
# POC can reach `modelsAsService: Managed`. In the mirrored environment,
# replace this file with a connection string to the real database and keep only
# the Secret below.
#
# sslmode=disable, deliberately: the guide's example uses sslmode=require,
# which is right for a managed instance with a real certificate. This pod
# serves plaintext inside the cluster network, and require would fail the
# connection with a TLS error that looks like a credentials problem.
#
# The Secret MUST live in redhat-ods-applications (that is where maas-api
# reads it), even though the database itself lives elsewhere.
---
apiVersion: v1
kind: Namespace
metadata:
  name: maas-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maas-postgres
  namespace: maas-postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-postgres
  namespace: maas-postgres
  labels:
    app: maas-postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a second pod would try to attach the same
  # RWO volume and both would block.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: maas-postgres
  template:
    metadata:
      labels:
        app: maas-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          env:
            - name: POSTGRESQL_USER
              value: maas
            - name: POSTGRESQL_PASSWORD
              value: maaspoc
            - name: POSTGRESQL_DATABASE
              value: maasdb
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: maas-postgres
  namespace: maas-postgres
spec:
  selector:
    app: maas-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: redhat-ods-applications
type: Opaque
stringData:
  DB_CONNECTION_URL: postgresql://maas:maaspoc@maas-postgres.maas-postgres.svc.cluster.local:5432/maasdb?sslmode=disable
