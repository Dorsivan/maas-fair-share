# Four real MaaSSubscriptions standing in for the tenant model.
#
# THE NAMES ARE THE IDENTITIES. MaaS injects
#   X-MaaS-Subscription: <MaaSSubscription name>
# from the validated API key, and that is what the fairness plugin keys on. So
# the `groups` match values in the EndpointPickerConfig must be these exact
# names -- not invented strings. Earlier configs matched `app1-production`
# because we set the header by hand; under real MaaS auth nothing would have
# matched and every tenant would have shared the `unclassified` weight.
#
# end-user-alpha and end-user-beta exist to exercise the PREFIX rule: two
# distinct subscriptions that must collapse into the single `end-users` flow.
# If grouping were broken they would appear as two queues each holding
# weight 65, and end users would get double their share.
#
# tokenRateLimits are deliberately enormous. They are the Kuadrant CEILING; a
# tight value here would mean the rate limiter, not the fairness policy, is
# allocating the pool -- and the measurement would be of the wrong thing.
# Watch for 429s during load: any at all invalidate the run.
---
apiVersion: user.openshift.io/v1
kind: Group
metadata: {name: maas-app1}
users: [dorsi]
---
apiVersion: user.openshift.io/v1
kind: Group
metadata: {name: maas-app2}
users: [dorsi]
---
apiVersion: user.openshift.io/v1
kind: Group
metadata: {name: maas-end-users}
users: [dorsi]
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: app1-production, namespace: models-as-a-service}
spec:
  owner: {groups: [{name: maas-app1}], users: []}
  modelRefs:
    - name: maas-vllm-gpu
      namespace: maas-fairness-poc
      tokenRateLimits: [{limit: 100000000, window: 1m}]
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: app2-batch, namespace: models-as-a-service}
spec:
  owner: {groups: [{name: maas-app2}], users: []}
  modelRefs:
    - name: maas-vllm-gpu
      namespace: maas-fairness-poc
      tokenRateLimits: [{limit: 100000000, window: 1m}]
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: end-user-alpha, namespace: models-as-a-service}
spec:
  owner: {groups: [{name: maas-end-users}], users: []}
  modelRefs:
    - name: maas-vllm-gpu
      namespace: maas-fairness-poc
      tokenRateLimits: [{limit: 100000000, window: 1m}]
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata: {name: end-user-beta, namespace: models-as-a-service}
spec:
  owner: {groups: [{name: maas-end-users}], users: []}
  modelRefs:
    - name: maas-vllm-gpu
      namespace: maas-fairness-poc
      tokenRateLimits: [{limit: 100000000, window: 1m}]
---
# All three groups may reach the model.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata: {name: maas-poc-access, namespace: models-as-a-service}
spec:
  modelRefs:
    - name: maas-vllm-gpu
      namespace: maas-fairness-poc
  subjects:
    groups:
      - {name: maas-app1}
      - {name: maas-app2}
      - {name: maas-end-users}
      - {name: maas-poc-users}
    users: []
---
# UNI-187: app3..app20, so the 6-group (UNI-165) and 20-group (UNI-167) cases
# have real identities to authenticate as. Same rules as the four above, plus:
#
# ONE NAME, FOUR PLACES. For appN (N>=3) the MaaSSubscription name, the key
# file in secret/maas-loadgen-keys, the EPP `groups:` exact-match value and
# the loadgen group name are all the bare string `appN`. The loadgen resolves
# any group it has no built-in for to /keys/<group-name> (04-loadgen.yaml,
# UNI-179), and the EPP matches the subscription NAME MaaS injects, so with
# one string there is nothing to keep in step. (app1/app2 keep their
# historical names, app1-production/app2-batch -- built-ins on both sides.)
#
# Owner group is the EXISTING maas-poc-users, not a new maas-appN group per
# tenant: the identity that applies these (paperclip:poc-agent) can create
# MaaSSubscriptions but not user.openshift.io Groups, nor patch the
# MaaSAuthPolicy below, and maas-poc-users is already one of its subjects.
# Ownership only gates who may mint a key for the subscription; the fairness
# identity is the subscription name, so sharing an owner group costs nothing.
#
# Two modelRefs, not one: maas-vllm-cpu is listed so the N-group tables can
# be smoke-tested on the CPU path without spending a GPU run
# (deploy/poc/20-n-group-smoke.sh). The four subscriptions above reference
# only maas-vllm-gpu, which is why that smoke uses app3..app8, not app1..app6.
#
# Apply ONLY these, by label -- a whole-file apply also touches the Groups
# and the MaaSAuthPolicy, which poc-agent cannot write:
#   oc apply -f deploy/maas/08-tenants.yaml -l maas-fair-share/tenant-set=n-group
# Adding them makes maas-controller regenerate maas-trlp-maas-vllm-{gpu,cpu}
# with 18 more entries -- a live Kuadrant change, so do it with no benchmark
# running.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: app3
  namespace: models-as-a-service
  labels: {maas-fair-share/tenant-set: n-group}
spec:
  owner: {groups: [{name: maas-poc-users}], users: []}
  modelRefs:
    - name: maas-vllm-gpu
      namespace: maas-fairness-poc
      tokenRateLimits: [{limit: 100000000, window: 1m}]
    - name: maas-vllm-cpu
      namespace: maas-fairness-poc
      tokenRateLimits: [{limit: 100000000, window: 1m}]
---
