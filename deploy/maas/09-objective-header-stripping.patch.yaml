# UNI-33: close outstanding-work item 15 in docs/poc-results.md.
#
# WHAT THIS FIXES
#
# github.com/llm-d/llm-d-router v0.11.0, pkg/epp/metadata/consts.go, resolves
# the EPP's priority-band header with aliases in this order:
#
#   ObjectiveKey        = "x-llm-d-inference-objective"       (checked FIRST)
#   OldObjectiveKey      = "x-gateway-inference-objective"     (fallback)
#
# (pkg/epp/metadata/consts.go:94-107, GetLowerCaseHeaderValue, pinned by
# TestGetLowerCaseHeaderValuePrefersCurrentName in the same package.)
#
# maas-poc-gateway-authn (generated by odh-model-controller when the
# LLMInferenceService's router.gateway.refs names this Gateway) already
# overwrites the OLD alias from the authenticated identity:
#
#   x-gateway-inference-objective:
#     plain: {expression: auth.identity.objective}
#
# but never touches the NEW, preferred key. A client that sets
# x-llm-d-inference-objective directly wins outright: the EPP never learns
# the header came from the client rather than the gateway, because
# GetLowerCaseHeaderValue only ever returns one value per logical key. Proven
# live on 2026-10-19 against maas-gateway-maas-fairness-poc: a request
# carrying `x-llm-d-inference-objective: exploit-high-priority` returns 200
# identically to a request without it -- nothing in the chain inspects,
# rejects or overwrites it today. See docs/gateway-header-stripping.md for the
# full before/after evidence and the exact curl commands.
#
# WHY A PATCH FILE, NOT A NEW RESOURCE
#
# Kuadrant allows exactly one AuthPolicy per targetRef. maas-poc-gateway-authn
# already targets Gateway/maas-poc-gateway and is regenerated by
# odh-model-controller, so this cannot be checked in as a second, independent
# AuthPolicy (it would conflict) and a full `oc apply -f` of a trimmed-down
# replacement would wipe the authentication/authorization rules the
# controller put there. The only safe operation is a JSON merge patch that
# adds one key to the existing `response.success.headers` map, leaving every
# other field untouched.
#
# HOW TO APPLY
#
#   oc --token="$OPENSHIFT_TOKEN" --server=https://api.ocp.paladinaura.com:6443 \
#     patch authpolicy maas-poc-gateway-authn -n maas-fairness-poc \
#     --type=merge --patch-file=deploy/maas/09-objective-header-stripping.patch.yaml
#
# This covers every current and future HTTPRoute parented to maas-poc-gateway
# in one place -- maas-poc-route, maas-vllm-cpu-kserve-route and
# maas-vllm-gpu-kserve-route today -- because the policy is Gateway-scoped,
# not per-route.
#
# RISK: ODH_MODEL_CONTROLLER MAY REVERT THIS ON RECONCILE
#
# maas-poc-gateway-authn is controller-owned. A future full reconcile (for
# example, redeploying an LLMInferenceService, or an RHOAI upgrade that
# regenerates the policy template) may overwrite this patch. There is no
# `opendatahub.io/managed: "false"`-style escape hatch for AuthPolicy
# documented anywhere in this repo (see deploy/maas/04-gateway.yaml for the
# one that exists for the Gateway itself). This is exactly why the
# conformance check (cmd/gateway-header-check) is meant to run against a live
# snapshot on a schedule or in a pre-flight check before trusting a
# measurement run, not just once at commissioning time -- see
# docs/gateway-header-stripping.md, "Keeping this from silently regressing".
#
# VERIFY
#
#   Build the checker once, offline -- see docs/gateway-header-stripping.md,
#   "Building this check air-gapped":
#     (cd cmd/gateway-header-check && go build -o ../../bin/gateway-header-check .)
#
#   oc get httproute,gateway,authpolicy -n maas-fairness-poc -o yaml \
#     | bin/gateway-header-check -
#
# must print "OK" and exit 0.
spec:
  rules:
    response:
      success:
        headers:
          x-llm-d-inference-objective:
            metrics: false
            plain:
              expression: auth.identity.objective
            priority: 0
