# POC model server: llm-d's own vLLM simulator, which speaks the OpenAI API and
# exports vLLM-shaped Prometheus metrics without needing a GPU.
#
# This exists so the fairness plugin can be exercised end to end before any GPU
# is attached. What it faithfully reproduces is exactly what this plugin
# depends on: per-request usage blocks (prompt/completion/cached token counts),
# realistic generation latency, and the vllm: metric names the EPP's scorers
# scrape. What it does NOT reproduce is real saturation -- it has no KV cache
# and no real compute, so it fakes backpressure rather than suffering it.
#
# Pinned to v0.11.x to match the llm-d-router version in go.mod. The simulator
# and the router share a release train; mixing majors risks metric-name drift,
# which would silently blank the scorers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-sim
  namespace: maas-fairness-poc
  labels:
    app: maas-sim
spec:
  # Two endpoints so the scheduler has a real choice to make -- with one pod
  # the picker is a no-op and endpoint selection bugs stay hidden.
  replicas: 2
  # Surge-free rollout. This cluster has two Ready workers sitting at ~98% of
  # allocatable CPU requested, so the default maxSurge: 25% creates a pod that
  # can never be scheduled and the rollout hangs indefinitely at
  # "1 out of 2 new replicas have been updated" while the OLD pods keep serving
  # -- which looks, from a curl, exactly like the config change having no
  # effect. Trading a moment of reduced capacity for a rollout that completes.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: maas-sim
  template:
    metadata:
      labels:
        app: maas-sim
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.4
          args:
            - --model
            - llama-3-1-8b
            - --port
            - "8000"
            # Small batch so a modest client load actually produces a queue.
            # Without contention the fairness policy is never consulted at all
            # (IterateQueues only visits non-empty queues), so the whole POC
            # would pass while proving nothing.
            - --max-num-seqs
            - "4"
            # The simulator defaults to 1024, which is far too small to carry a
            # realistic prompt: deploy/poc/04-loadgen.yaml sends ~1200 prompt
            # tokens plus 200 output and every single request comes back
            # 400 BadRequestError. That failure is near-invisible from the
            # client -- curl treats a 400 as a successful transfer -- and it
            # produces a load run that looks fast and healthy while measuring
            # nothing. Keep this comfortably above (prompt + max_tokens).
            - --max-model-len
            - "4096"
            - --mode
            - random
            # Generation slow enough that requests overlap and the in-flight
            # provisional-charge path is genuinely exercised.
            - --time-to-first-token
            - 200ms
            - --inter-token-latency
            - 20ms
          ports:
            - containerPort: 8000
              name: http
          resources:
            # The simulator spends its time in sleeps (--time-to-first-token,
            # --inter-token-latency), not in compute, so it needs very little
            # CPU. Keeping the request small is what lets this POC run on a
            # cluster with no real headroom.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: maas-sim
  namespace: maas-fairness-poc
spec:
  selector:
    app: maas-sim
  ports:
    - name: http
      port: 8000
      targetPort: 8000
