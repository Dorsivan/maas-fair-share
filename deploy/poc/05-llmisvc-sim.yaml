# The SAME plugin, deployed the official way: a real LLMInferenceService whose
# scheduler is templated by RHOAI's own KServe preset.
#
# WHY THIS EXISTS ALONGSIDE 02-epp.yaml
#
# 02-epp.yaml runs the EPP as a plain Deployment we write by hand. That is the
# fast test rig: it isolates the fairness policy from KServe's templating, it
# starts in seconds, and it is what every number in docs/poc-results.md was
# measured on. Keep it.
#
# But it proves nothing about the path this will actually ship on. Under KServe
# the EPP's command, ports, TLS flags and pool wiring are all TEMPLATED by the
# preset, not written by us -- and that templating is exactly where a custom
# image breaks. This file is that path.
#
# HOW IT AVOIDS NEEDING A GPU
#
# The presets compose cleanly, one concern each:
#   v3-5-0-kserve-config-llm-scheduler    -> spec.router.scheduler  (the EPP)
#   v3-5-0-kserve-config-llm-router-route -> spec.router.route      (the HTTPRoute)
#   v3-5-0-kserve-config-llm-template     -> spec.template          (vLLM on GPU)
#
# We take the first two and DELIBERATELY OMIT the third, supplying our own
# model-server template pointing at the simulator. That is not a workaround for
# the sake of it: the third preset's command ends in `exec vllm serve
# /mnt/models`, so it requires real weights staged by a storage initializer and
# a real accelerator. Omitting it leaves the part we actually need to test --
# the scheduler templating -- fully intact and running the genuine preset.
#
# The production variant is deploy/llmisvc.yaml, which keeps all three presets
# and the GPU limits. The scheduler stanza should stay in sync between the two.
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: maas-llmisvc
  namespace: maas-fairness-poc
spec:
  baseRefs:
    - name: v3-5-0-kserve-config-llm-scheduler
    - name: v3-5-0-kserve-config-llm-router-route

  model:
    # A deliberately TINY real model, and the simulator never reads it.
    #
    # Empty is what the shipped presets use, but a real instance rejects it at
    # reconcile time with "invalid model URI:" -- the controller requires
    # something it can attach as model artifacts. A fake URI is worse than no
    # URI: it is accepted here and then fails slowly inside the
    # storage-initializer init container, where the error is far less obvious.
    #
    # So we give it the smallest public model that will satisfy the artifact
    # attachment and download in seconds. The simulator serves synthetic
    # responses and never opens /mnt/models, so the weights are irrelevant --
    # this exists purely to get past the controller's validation and exercise
    # the real reconcile path.
    uri: hf://hf-internal-testing/tiny-random-LlamaForCausalLM
    # Must match --model on the simulator below and the `model` field clients
    # send, or requests 404 at the model server.
    name: llama-3-1-8b

  replicas: 2

  # ---------------------------------------------------------------------------
  # Model server: the simulator, standing in for vLLM
  # ---------------------------------------------------------------------------
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.4
        # The command MUST be set explicitly, even though this is the image's
        # own entrypoint and even though the GPU preset is omitted from
        # baseRefs above.
        #
        # Omitting baseRefs does NOT omit the template: the controller merges
        # the well-known default preset regardless (status shows
        # PresetsCombined: True), so the container inherits that preset's
        # command -- a large bash script doing RoCE/NCCL discovery before
        # `exec vllm serve /mnt/models`. The simulator image is distroless and
        # has no shell, so the pod dies with:
        #     container create failed: executable file `/bin/bash` not found
        # which reads like a broken image rather than an inherited command.
        #
        # Setting command here overrides the merged one by strategic merge.
        # Args survive the merge intact either way.
        command: ["/app/llm-d-inference-sim"]
        args:
          - --model
          - llama-3-1-8b
          - --port
          - "8000"
          - --max-num-seqs
          - "4"
          - --max-model-len
          - "4096"
          - --mode
          - random
          - --time-to-first-token
          - 200ms
          - --inter-token-latency
          - 20ms
          # TLS, because this cluster has enableLLMInferenceServiceTLS: true.
          #
          # KServe templates the health probes as https://:8000/health and
          # mounts a serving cert at /var/run/kserve/tls (volume `tls-certs`)
          # for vLLM, which gets --ssl-certfile/--ssl-keyfile from the GPU
          # preset. Our container replaces that preset's command, so it has the
          # certs mounted but was still serving plaintext, and every probe
          # failed with:
          #     Startup probe failed: http: server gave HTTP response to HTTPS client
          # while the simulator logged the TLS ClientHello as a garbage HTTP
          # method. The pod runs, serves fine over http, and never goes Ready.
          #
          # deploy/poc/02-epp.yaml does NOT need this: the hand-rolled rig sets
          # --secure-serving=false and probes over plaintext. This is purely a
          # consequence of going through KServe on a TLS-enabled cluster, and
          # it is exactly the sort of difference the direct rig cannot surface.
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        ports:
          # The scheduler preset's pool hardcodes targetPorts: [{number: 8000}],
          # so the model server MUST listen on 8000.
          - containerPort: 8000
            name: http
            protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi

  # ---------------------------------------------------------------------------
  # Router: gateway, route, and the scheduler carrying our plugin
  # ---------------------------------------------------------------------------
  router:
    gateway:
      refs:
        # Our own POC gateway rather than the shared data-science-gateway in
        # openshift-ingress, whose listener restricts allowedRoutes to
        # openshift-ingress and redhat-ods-applications. Attaching there would
        # mean editing a resource RHOAI owns.
        - name: maas-poc-gateway
          namespace: maas-fairness-poc
    route: {}
    scheduler:
      # One replica, always -- all fairness state is in-process. See the long
      # note in deploy/llmisvc.yaml; it is a correctness constraint, not a cost
      # decision.
      replicas: 1

      config:
        ref:
          name: maas-epp-config
          key: epp

      template:
        containers:
          # The name MUST be "main" -- KServe merges by container name, and any
          # other name appends a SECOND container rather than overriding the
          # EPP, leaving a pod running both.
          - name: main
            # The only field that must change from the preset. Notably NOT
            # command/args: the preset templates --pool-name, --pool-namespace,
            # the ports and all the TLS flags, and replacing it means
            # re-deriving every one of those by hand and re-syncing on each
            # RHOAI bump.
            #
            # On registerDownstreamCompatFlags() in cmd/epp/main.go: this
            # deployment did NOT exercise it. The preset source contains
            #   {{ if .GlobalConfig.EnableTLS }}--model-server-metrics-scheme=https{{- end }}
            # and TLS IS enabled here -- the sibling TLS-gated flags
            # (--secure-serving=true, --cert-path, --enable-cert-reload) were
            # all templated -- yet the rendered command omits that one, and the
            # EPP's flag dump shows it empty. KServe instead injected a
            # metrics-data-source plugin with scheme: https into the config,
            # which is the v0.10.0+ mechanism.
            #
            # The shim stays as cheap defensive code, since the preset can
            # clearly emit the flag and an unknown flag is fatal to pflag. But
            # do not describe it as load-bearing on this evidence.
            image: quay.io/rh-ee-dsivan/maas-fair-share@sha256:6918308df0e1c8f3b6b5b9af3b1b341205ccbd1da4a3e55f82d6330a354c8bbf
            imagePullPolicy: Always
            resources:
              # The preset asks for cpu: 1 / limits 6 CPU / 16Gi. This cluster
              # has two Ready workers at ~95-99% of allocatable CPU requested,
              # so the preset's request alone will not schedule. Overriding
              # resources is the one further deviation from stock, and it is an
              # environment constraint rather than anything about the plugin.
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
