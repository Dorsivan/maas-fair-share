# A RHOAI 3.4-SHAPED scheduler preset, used to test our image against the flag
# set 3.4 would give it -- without a 3.4 cluster.
#
# WHY THIS EXISTS
#
# This cluster's operator is 3.4.4 but its KServe artifacts are 3.5.0, so simply
# deploying here re-tests 3.5 and proves nothing about 3.4. The command below is
# copied from the real rhoai-3.4 branch of red-hat-data-services/kserve
# (config/llmisvcconfig/config-llm-scheduler.yaml), with ONLY the image changed
# to ours.
#
# WHAT IT DOES TEST
#
# The one flag that differs and could be fatal:
#     {{ if .GlobalConfig.EnableTLS }}--model-server-metrics-scheme=https{{- end }}
# 3.4 templates it; the 3.5 preset on this cluster does NOT. It exists only in
# Red Hat's downstream EPP fork, and upstream pflag treats an unknown flag as
# fatal -- so without registerDownstreamCompatFlags() in cmd/epp/main.go our
# image would crash-loop on every 3.4 cluster. TLS is enabled here, so this
# renders for real.
#
# WHAT IT DOES NOT TEST
#
#   - The 3.4 CONTROLLER. Reconciliation here is still done by 3.5's controller,
#     so whether 3.4 validates our EndpointPickerConfig before passing it, and
#     whether its InferencePool matches what a v0.11.0 EPP watches, remain open.
#   - The tokenizer sidecar. 3.4's preset adds a second container
#     (ghcr.io/llm-d/llm-d-uds-tokenizer:v0.7.1) sharing a `tokenizer-uds`
#     volume that the CONTROLLER injects. The 3.5 controller will not create
#     that volume, so including the container here would fail for a reason
#     having nothing to do with our plugin. Deliberately omitted -- it is the
#     main thing still to check on a real 3.4 cluster.
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: maas-rhoai34-scheduler-shape
  namespace: maas-fairness-poc
spec:
  router:
    scheduler:
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            kind: Service
            name: |-
              {{ ChildName .ObjectMeta.Name `-epp-service` }}
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: |-
                {{ .ObjectMeta.Name }}
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
      annotations:
        "app.kubernetes.io/version": "0.7.0"
      template:
        containers:
          - name: main
            ports:
              - containerPort: 9002
                name: grpc
                protocol: TCP
              - containerPort: 9003
                name: grpc-health
                protocol: TCP
              - containerPort: 9090
                name: metrics
                protocol: TCP
              - containerPort: 5557
                name: zmq
                protocol: TCP
            # THE ONLY DEVIATION from the rhoai-3.4 preset: our image in place
            # of ghcr.io/llm-d/llm-d-inference-scheduler:v0.7.1
            image: quay.io/rh-ee-dsivan/maas-fair-share@sha256:6918308df0e1c8f3b6b5b9af3b1b341205ccbd1da4a3e55f82d6330a354c8bbf
            imagePullPolicy: Always
            livenessProbe:
              failureThreshold: 3
              grpc:
                port: 9003
                service: liveness
              initialDelaySeconds: 5
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            readinessProbe:
              failureThreshold: 3
              grpc:
                port: 9003
                service: readiness
              initialDelaySeconds: 30
              periodSeconds: 10
              successThreshold: 1
              timeoutSeconds: 1
            command:
              - /app/epp
              - --pool-name
              - "{{ ChildName .ObjectMeta.Name `-inference-pool` }}"
              - --pool-namespace
              - "{{ .ObjectMeta.Namespace }}"
              - --zap-encoder
              - json
              - --grpc-port
              - "9002"
              - --grpc-health-port
              - "9003"
              - '{{ if .GlobalConfig.EnableTLS }}--enable-cert-reload=true{{- end }}'
              - '{{ if .GlobalConfig.EnableTLS }}--secure-serving=true{{- end }}'
              - '{{ if .GlobalConfig.EnableTLS }}--model-server-metrics-scheme=https{{- end }}'
              - '{{ if .GlobalConfig.EnableTLS }}--cert-path=/var/run/kserve/tls{{- end }}'
            env:
              - name: SSL_CERT_DIR
                value: "/var/run/kserve/tls:/var/run/secrets/kubernetes.io/serviceaccount:/etc/pki/tls/certs"
            resources:
              requests:
                cpu: 256m
                memory: 500Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - mountPath: /var/run/kserve/tls
                name: tls-certs
                readOnly: true
---
# An LLMInferenceService driven by the 3.4-shaped preset above.
# Everything else matches 05-llmisvc-sim.yaml.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: maas-llmisvc34
  namespace: maas-fairness-poc
spec:
  baseRefs:
    - name: maas-rhoai34-scheduler-shape
  model:
    uri: hf://hf-internal-testing/tiny-random-LlamaForCausalLM
    name: llama-3-1-8b
  replicas: 1
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.4
        command: ["/app/llm-d-inference-sim"]
        args:
          - --model
          - llama-3-1-8b
          - --port
          - "8000"
          - --max-num-seqs
          - "4"
          - --max-model-len
          - "4096"
          - --mode
          - random
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
  router:
    gateway:
      refs:
        - name: maas-poc-gateway
          namespace: maas-fairness-poc
    route: {}
    scheduler:
      replicas: 1
      config:
        ref:
          name: maas-epp-config
          key: epp
