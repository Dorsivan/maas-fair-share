# UNI-43: strip x-llm-d-inference-objective on the direct rig (deploy/poc/02-epp.yaml
# + deploy/poc/03-gateway.yaml), which has no Authorino/Kuadrant layer and therefore
# no trusted identity to overwrite the header with (contrast deploy/maas/09-...,
# which overwrites it from auth.identity.objective on the MaaS path).
#
# THIS FILE REPLACES THE "RequestHeaderModifier remove" CANDIDATE NAMED IN THE TICKET.
#
# That candidate does not work. See docs/gateway-header-stripping.md, "UNI-43: the
# RequestHeaderModifier candidate does not protect the EPP's read" for the full
# evidence. Short version: a Gateway API RequestHeaderModifier `remove` filter
# compiles to Envoy's route-level `request_headers_to_remove`, which the Router
# filter applies in `finalizeRequestHeaders` -- the Router filter is always the
# LAST filter in the HTTP filter chain (it is what dispatches upstream). The
# Gateway API Inference Extension's `ext_proc` filter (the EPP) is an ordinary
# decoder filter positioned BEFORE Router, with RequestHeaderMode: SEND
# (pilot/pkg/networking/core/route/route.go's buildExtProcPerRoute). So ext_proc
# always sees the client's original header before Router ever removes it for the
# upstream-bound copy. The route-level filter would have hidden the forged header
# from the simulator backend while leaving the EPP's priority decision exploited --
# strictly worse than doing nothing, because it would look fixed.
#
# THE MECHANISM THAT ACTUALLY RUNS BEFORE ext_proc
#
# Envoy's `envoy.filters.http.header_mutation` filter is a real HTTP filter with a
# chain position, not a Router-applied route field -- Envoy's own docs recommend it
# specifically because "it provides complete control over the position and ordering
# of mutations" (envoyproxy.io, configuration/http/http_filters/header_mutation_filter).
# Installed via Istio's EnvoyFilter CRD with INSERT_BEFORE targeting
# envoy.filters.http.ext_proc (Istio's registered name for the EPP filter --
# pilot/pkg/xds/filters/filters.go's InferencePoolExtProc uses Envoy's well-known
# constant, which is literally "envoy.filters.http.ext_proc"), its decodeHeaders
# runs ahead of ext_proc's, so the removal is visible to the EPP, not just to the
# upstream simulator.
#
# WHY TWO PATCHES, NOT ONE, AND WHY THE FIRST ONE IS A DELIBERATE NO-OP
#
# maas-poc-gateway is shared: maas-poc-route (this rig, unauthenticated) AND
# maas-vllm-cpu-kserve-route / maas-vllm-gpu-kserve-route (the MaaS path,
# authenticated, already fixed by deploy/maas/09-...) are all parented to it. The
# HTTP filter CHAIN is a listener-wide concept -- there is one http_filters list
# per Gateway, shared by every route on it. If the header_mutation filter actually
# removed the header unconditionally, it would ALSO strip the value Authorino just
# set for the authenticated routes, undoing UNI-33 for production traffic on this
# cluster. So:
#
#   1. HTTP_FILTER patch: installs header_mutation into the chain, INSERT_BEFORE
#      ext_proc, with an EMPTY mutations block. Inert by itself -- a filter with no
#      configured mutation does nothing, for any route.
#   2. HTTP_ROUTE patch: merges a per-route override (HeaderMutationPerRoute) onto
#      ONLY the route matched by name below, turning the removal on for that route
#      alone. A route that doesn't match this patch is unaffected, by construction,
#      not by convention -- if the name match in patch 2 is wrong, the net effect is
#      "nothing happens" (fails closed on the fix, not open on production), not
#      "removes the header everywhere."
#
# This targetRefs shape (Gateway, by name) mirrors the kuadrant-auth-maas-poc-gateway
# and kuadrant-ratelimiting-maas-poc-gateway EnvoyFilters odh-model-controller/Kuadrant
# already run on this exact Gateway in this namespace -- confirmed live,
# 2026-10-19 (`oc get envoyfilter -n maas-fairness-poc`), not merely documented
# elsewhere.
#
# VERIFIED LIVE, 2026-10-19 -- `pilot-agent request GET config_dump` against
# maas-poc-gateway-data-science-gateway-class-58b4f8c4b4-2zvgw's istio-proxy
# container (pods/exec; the admin API binds loopback-only, so pods/proxy to the
# pod IP gets connection-refused regardless of RBAC -- pilot-agent's built-in
# client is the way in):
#
#   - The route name assumed below was WRONG. Istio does not name the generated
#     route after the HTTPRoute rule's `name` field -- the live
#     dynamic_route_configs dump (resource=dynamic_route_configs) shows the
#     vhost `*:80` route for 03-gateway.yaml's rule is actually named
#     `maas-fairness-poc.maas-poc-route.0` (pattern: `<namespace>.<HTTPRoute
#     name>.<rule index>`), not `v1-chat-completions`. Corrected below -- had
#     this been applied with the original guess, patch 2 would have matched
#     nothing, and the EnvoyFilter would have been a silent no-op passing every
#     check that only looks for the resource to exist.
#   - The ext_proc filter's registered name WAS correct: the live
#     dynamic_listeners dump (resource=dynamic_listeners) for listener
#     `0.0.0.0_80` shows the HCM's http_filters in order --
#     [istio.metadata_exchange, kuadrant wasm, envoy.filters.http.ext_proc,
#     envoy.filters.http.grpc_stats, istio.alpn, envoy.filters.http.fault,
#     envoy.filters.http.cors, istio.stats, envoy.filters.http.router] --
#     confirming both the exact name used as the INSERT_BEFORE anchor and that
#     ext_proc already runs ahead of Router, consistent with the mechanism
#     this fix relies on.
#   - Applying this does NOT demonstrate a behavioural fix by itself -- as already
#     recorded in docs/poc-results.md, there are zero InferenceObjective resources
#     on this cluster, so no priority band currently exists to jump. Verification
#     here means: a forged x-llm-d-inference-objective header no longer reaches the
#     EPP's ext_proc call (observable via the EPP's DEBUG-level "LLM request
#     assembled" log line, director.go:237, same constraint UNI-33 hit: this
#     ServiceAccount cannot raise the EPP's log verbosity) or, more simply, no
#     longer reaches the simulator backend at all (visible at any log level).
#
# HOW TO APPLY
#
#   oc --token="$OPENSHIFT_TOKEN" --server=https://api.ocp.paladinaura.com:6443 \
#     apply -f deploy/poc/11-objective-header-removal.yaml
#
# HOW THIS WAS VERIFIED LIVE, 2026-10-19
#
#   The Envoy admin interface binds loopback-only, so `pods/proxy` to the pod
#   IP returns connection-refused regardless of RBAC. The way in is `pods/exec`
#   plus the istio-proxy container's own `pilot-agent request GET <path>`,
#   which calls back to 127.0.0.1:15000 from inside the pod:
#
#     oc exec -n maas-fairness-poc <gateway-pod> -c istio-proxy -- \
#       pilot-agent request GET config_dump
#
#   Before applying: pulled `resource=dynamic_route_configs` to find the real
#   route name (corrected above) and `resource=dynamic_listeners` to confirm
#   the ext_proc filter's exact registered name -- see "VERIFIED LIVE" above.
#
#   After applying, the same two dumps confirmed:
#     - Chain order for listener 0.0.0.0_80 is now [..., kuadrant wasm,
#       envoy.filters.http.header_mutation, envoy.filters.http.ext_proc, ...] --
#       header_mutation runs immediately before ext_proc, as designed.
#     - Exactly one route carries the `envoy.filters.http.header_mutation`
#       per-route override: `maas-fairness-poc.maas-poc-route.0`. No other
#       route in the dump (including the two MaaS kserve routes sharing this
#       Gateway) has it -- the scoping holds, UNI-33's production fix is intact.
#
#   Built cmd/gateway-header-check offline (GOPROXY=off, vendored deps -- see
#   docs/gateway-header-stripping.md, "Building this check air-gapped") and ran
#   it against the live cluster. It still prints FAIL for
#   maas-fairness-poc/maas-poc-route, as expected: the checker only recognises
#   AuthPolicy-based overwrite coverage today (written for the authenticated
#   path). Teaching it to recognise this EnvoyFilter-based removal pattern is
#   legitimate follow-up work, filed as a backlog idea rather than attempted
#   here now that the route-name assumption has been checked against a live
#   config dump, to keep that scope change deliberate rather than bundled in.
#
#   NOT verified: an end-to-end request showing a forged header fails to reach
#   the EPP or the simulator. maas-epp and maas-sim remain scaled to 0/0 on this
#   cluster (same state confirmed before starting this work) -- scaling either
#   up to send a test request was out of scope for this ticket and would touch
#   a shared rig without a measurement run to justify it. The filter-chain and
#   per-route evidence above is config-level, not traffic-level.
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: maas-poc-route-objective-header-removal
  namespace: maas-fairness-poc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-poc-gateway
  configPatches:
    # 1. Install header_mutation into the chain, inert until patch 2 enables it
    #    for a specific route.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_proc
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.header_mutation
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
            mutations: {}
    # 2. Turn the removal on, scoped to maas-poc-route's one rule by name --
    #    confirmed live, 2026-10-19, see "VERIFIED LIVE" above.
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: maas-fairness-poc.maas-poc-route.0
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.header_mutation:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
              mutations:
                request_mutations:
                  - remove: x-llm-d-inference-objective
