# Scrapes the EPP's metrics port into OpenShift user-workload monitoring.
#
# PREREQUISITE, and it is not optional: user-workload monitoring must be on, or
# this object is accepted by the API server and then silently ignored forever.
# Check and enable with:
#
#   oc -n openshift-monitoring get cm cluster-monitoring-config \
#     -o jsonpath='{.data.config\.yaml}' | grep enableUserWorkload
#
#   # if absent or false, add to the config.yaml key:
#   enableUserWorkload: true
#
# PodMonitor rather than ServiceMonitor deliberately. KServe's EPP Service
# exposes only the gRPC port (9002) for Envoy's ext_proc; the metrics port is
# on the pod and not in the Service, so a ServiceMonitor has nothing to select.
#
# Scraping the POD also matters for correctness here: the EPP runs replicas: 1
# with all fairness state in process, so there is exactly one source of truth.
# If this is ever scaled out, per-pod series stop being comparable -- each pod
# would hold its own partial view of every tenant's tab.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: maas-epp
  namespace: maas-fairness-poc
  labels:
    app.kubernetes.io/name: maas-epp
spec:
  selector:
    matchLabels:
      # KServe labels the scheduler pod with the LLMInferenceService name and
      # kserve.io/component: router-scheduler. Confirm against the live pod
      # before trusting this -- a selector that matches nothing produces no
      # error anywhere, just empty graphs:
      #   oc get pod -n maas-fairness-poc --show-labels | grep scheduler
      kserve.io/component: router-scheduler
  podMetricsEndpoints:
    - port: metrics          # the name from the scheduler preset's containerPort
      path: /metrics
      interval: 15s
      # http, NOT https -- and this is counter-intuitive enough to be worth the
      # paragraph, because it is wrong on a TLS-enabled cluster in the way that
      # looks most obviously right.
      #
      # The metrics scheme is decided by --metrics-cert-dir and by NOTHING
      # else: upstream documents "Empty serves metrics over HTTP"
      # (pkg/epp/server/metrics_tls_test.go). It is NOT governed by
      # --secure-serving, which covers only the ext_proc gRPC server. So an EPP
      # can be serving ext_proc over TLS while its metrics port is plaintext --
      # and under KServe that is exactly what happens.
      #
      # Verified against the preset this cluster actually runs (RHOAI 3.4.0,
      # llminferenceserviceconfig/v3-5-0-kserve-config-llm-scheduler): it
      # templates --secure-serving=true and --cert-path when EnableTLS is set,
      # but NEVER sets --metrics-cert-dir. Grep it yourself before changing
      # this:
      #   oc get llminferenceserviceconfig v3-5-0-kserve-config-llm-scheduler \
      #     -n redhat-ods-applications -o yaml | grep -c metrics-cert-dir   # 0
      #
      # Set this to https and the Prometheus target dies with a TLS handshake
      # error while every other part of the stack looks healthy.
      scheme: http
      # Auth, unlike TLS, IS on: the preset does not pass
      # --metrics-endpoint-auth either, and it defaults to true. So the scrape
      # is plaintext but still needs a bearer token -- an unusual combination,
      # and the reason both of these lines are needed rather than one or the
      # other. The token is the one minted in deploy/rbac.yaml; without it
      # every scrape gets 401 and, again, the only symptom is empty graphs.
      bearerTokenSecret:
        name: maas-epp-metrics-reader-token
        key: token
