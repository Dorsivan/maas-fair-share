groups:
  premium:
    weight: 50
    api_keys:
      - "sk-premium-key-1"
      - "sk-premium-key-2"
  standard:
    weight: 30
    api_keys:
      - "sk-standard-key-1"
  free:
    weight: 20
    api_keys:
      - "sk-free-key-1"
      - "sk-free-key-2"

settings:
  max_tokens_per_window: 1000000
  window_seconds: 60
  max_queue_depth: 100
  max_concurrent: 50
  default_group: "free"
